<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE — Professional Edition</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #2ecc71;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border: #333333;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .brand {
            letter-spacing: 4px;
            font-weight: 300;
            font-size: 14px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .score-container {
            text-align: right;
        }

        .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
        }

        .value {
            font-size: 24px;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        #canvas-wrapper {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 5px;
            border-radius: 4px;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(18, 18, 18, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .status-text {
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--primary);
            text-transform: uppercase;
        }

        button {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
            padding: 10px 30px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--text-main);
            color: var(--bg);
        }

        footer {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <div class="brand">System.Snake</div>
        <div class="score-container">
            <div class="label">Current Session</div>
            <div id="score" class="value">000</div>
        </div>
    </header>

    <div id="canvas-wrapper">
        <canvas id="game"></canvas>
        <div id="overlay">
            <div id="msg" class="status-text">Ready for Input</div>
            <button id="start-btn">Initialize</button>
        </div>
    </div>

    <footer>ARROWS OR WASD TO NAVIGATE</footer>
</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const msgEl = document.getElementById('msg');

    // CONFIGURATION
    const CELL_SIZE = 20;
    const GRID_COUNT = 20;
    canvas.width = canvas.height = CELL_SIZE * GRID_COUNT;

    let snake, food, direction, nextDirection, gameLoop, score;
    let isPaused = true;

    function init() {
        snake = [
            {x: 10, y: 10},
            {x: 10, y: 11},
            {x: 10, y: 12}
        ];
        direction = {x: 0, y: -1};
        nextDirection = {x: 0, y: -1};
        score = 0;
        scoreEl.innerText = "000";
        spawnFood();
        isPaused = false;
        overlay.style.display = 'none';
        
        if(gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, 100);
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * GRID_COUNT),
            y: Math.floor(Math.random() * GRID_COUNT)
        };
        // Check if food is on snake body
        if(snake.some(part => part.x === food.x && part.y === food.y)) spawnFood();
    }

    function update() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        // Collision Check
        if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT || 
            snake.some(part => part.x === head.x && part.y === head.y)) {
            return gameOver();
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.innerText = score.toString().padStart(3, '0');
            spawnFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // Clear Canvas
        ctx.fillStyle = '#1e1e1e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Grid lines (Professional subtle touch)
        ctx.strokeStyle = '#252525';
        ctx.lineWidth = 1;
        for(let i=0; i <= canvas.width; i += CELL_SIZE) {
            ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
        }

        // Draw Food
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(
            food.x * CELL_SIZE + CELL_SIZE/2, 
            food.y * CELL_SIZE + CELL_SIZE/2, 
            CELL_SIZE/4, 0, Math.PI * 2
        );
        ctx.fill();

        // Draw Snake
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? '#2ecc71' : '#27ae60';
            // Draw slightly smaller than cell for "classic pixel" look
            ctx.fillRect(
                part.x * CELL_SIZE + 1, 
                part.y * CELL_SIZE + 1, 
                CELL_SIZE - 2, 
                CELL_SIZE - 2
            );
        });
    }

    function gameOver() {
        clearInterval(gameLoop);
        isPaused = true;
        msgEl.innerText = "System Failure";
        msgEl.style.color = "#e74c3c";
        startBtn.innerText = "Restart System";
        overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', e => {
        const key = e.key.toLowerCase();
        if ((key === 'arrowup' || key === 'w') && direction.y === 0) nextDirection = {x: 0, y: -1};
        if ((key === 'arrowdown' || key === 's') && direction.y === 0) nextDirection = {x: 0, y: 1};
        if ((key === 'arrowleft' || key === 'a') && direction.x === 0) nextDirection = {x: -1, y: 0};
        if ((key === 'arrowright' || key === 'd') && direction.x === 0) nextDirection = {x: 1, y: 0};
    });

    startBtn.onclick = init;

    // Initial draw
    draw();
</script>
</body>
</html>
